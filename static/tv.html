<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numeri pronti</title>
<style>
  :root {
    --bg: #0b0f14;
    --tile: #202a36;
    --text: #f4f7fb;
    --muted: #7f8fa3;
    --accent: #ffc107;
    --accent-ink: #241c00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    cursor: none;
  }

  /* Un'unica griglia a tutto schermo: i numeri esposti, il piu' grossi
     possibile. Colonne e corpo del testo li calcola lo script. */
  #grid {
    height: 100%; width: 100%;
    display: grid; gap: 1.4vh; padding: 1.4vh;
    align-content: stretch; justify-content: stretch;
  }
  .num {
    background: var(--tile); border-radius: 2vh;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    min-width: 0; min-height: 0; overflow: hidden;
    animation: pop 0.35s ease-out;
  }
  .num.latest { background: var(--accent); color: var(--accent-ink); }
  .num.latest.flash { animation: pop 0.35s ease-out, flash 1.1s ease-out 3; }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } }
  @keyframes flash {
    0%, 100% { background: var(--accent); }
    50%      { background: #fff8dc; }
  }

  /* A tabellone vuoto parla ai clienti, non al personale. */
  #empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 6vw;
    color: var(--muted); font-size: 7vh; font-weight: 600; line-height: 1.2;
  }

  #audioHint {
    position: fixed; bottom: 1.6vh; left: 2vh;
    background: #2a3340; color: var(--muted); font-size: 1.9vh; font-weight: 600;
    padding: 0.8vh 1.6vh; border-radius: 1vh; display: none;
  }
  #audioHint.show { display: block; }

  #offline {
    position: fixed; bottom: 1.6vh; right: 2vh;
    background: #b3261e; color: #fff; font-size: 2.2vh; font-weight: 700;
    padding: 0.9vh 1.8vh; border-radius: 1vh; display: none;
  }
  #offline.show { display: block; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="empty" hidden>Stiamo preparando i vostri ordini</div>
<div id="audioHint">🔇 tocca lo schermo o premi un tasto per attivare il suono</div>
<div id="offline">CONNESSIONE PERSA</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), emptyEl = $('empty'), offline = $('offline');
  var lastVersion = -1, lastAdds = null;
  var numbers = [], highlight = null;

  var GAP = 0.014, PAD = 0.014;         // le stesse misure del CSS, in frazioni di vh

  // Cerca la disposizione che rende i numeri piu' grandi possibile: prova
  // tutte le colonne e tiene quella con il corpo del testo maggiore.
  function layout() {
    var n = numbers.length;
    if (!n) return;
    var vh = window.innerHeight;
    var gap = GAP * vh, pad = PAD * vh;
    var W = window.innerWidth - 2 * pad, H = vh - 2 * pad;
    var digits = 1;
    numbers.forEach(function (x) { digits = Math.max(digits, String(x).length); });

    var best = { cols: 1, size: 0 };
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var w = (W - gap * (cols - 1)) / cols;
      var h = (H - gap * (rows - 1)) / rows;
      if (w <= 0 || h <= 0) continue;
      // Una cifra occupa circa 0.62 em di larghezza; lascio un margine interno.
      var size = Math.min(h * 0.78, (w * 0.88) / (digits * 0.62));
      if (size > best.size) best = { cols: cols, size: size };
    }

    grid.style.gridTemplateColumns = 'repeat(' + best.cols + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + Math.ceil(n / best.cols) + ', 1fr)';
    grid.style.fontSize = Math.floor(best.size) + 'px';
  }

  function draw(flash) {
    grid.innerHTML = '';
    numbers.forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'num' + (n === highlight ? ' latest' + (flash ? ' flash' : '') : '');
      el.textContent = n;
      grid.appendChild(el);
    });
    emptyEl.hidden = numbers.length > 0;
    grid.style.display = numbers.length ? 'grid' : 'none';
    layout();
  }

  function render(state) {
    if (state.version === lastVersion) return;
    lastVersion = state.version;

    numbers = (state.numbers || []).slice().sort(function (a, b) { return a - b; });
    // In giallo l'ultimo numero inserito ancora esposto: se lo tolgono, il
    // giallo passa da solo a quello prima.
    highlight = (state.highlight === undefined) ? null : state.highlight;

    // Squilla e lampeggia solo a un inserimento nuovo, non quando il giallo
    // si sposta perche' qualcuno ha tolto un numero.
    var isNew = lastAdds !== null && state.adds > lastAdds;
    lastAdds = state.adds;
    draw(isNew);
    if (isNew) kaching();
  }

  window.addEventListener('resize', layout);

  // ---- suono di cassa, sintetizzato: niente file audio da caricare --------

  var audioCtx = null, noiseBuf = null, master = null;

  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      // Un compressore in coda: i colpi di campanello sommano molte parziali
      // e sugli altoparlanti della TV, a volume alto, gracchierebbero.
      var comp = audioCtx.createDynamicsCompressor();
      master = audioCtx.createGain();
      master.gain.value = 0.9;
      master.connect(comp).connect(audioCtx.destination);
    }
    return audioCtx;
  }

  // Il "clack" del cassetto: rumore breve, non una nota.
  function noise(c) {
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 0.2), c.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  function clack(c, t) {
    var src = c.createBufferSource();
    src.buffer = noise(c);
    var bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.9;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 0.2);
  }

  // Un colpo di campanello: parziali inarmoniche, quelle acute si spengono
  // prima. E' questo che distingue un "deng" metallico da un bip.
  var PARTIALS = [[1, 1, 1], [2.01, 0.55, 0.7], [2.99, 0.38, 0.5],
                  [4.21, 0.24, 0.35], [5.43, 0.15, 0.25]];

  function strike(c, t, f0, vol, decay) {
    PARTIALS.forEach(function (p) {
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f0 * p[0], t);
      var peak = vol * p[1], len = decay * p[2];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      osc.connect(g).connect(master);
      osc.start(t); osc.stop(t + len + 0.02);
    });
  }

  function play() {
    var c = ctx();
    if (!c) return;
    var t = c.currentTime + 0.02;
    clack(c, t);                          // cassetto
    strike(c, t + 0.005, 1046.5, 0.30, 1.1);   // deng
    strike(c, t + 0.10,  1568.0, 0.26, 1.4);   // ...deng, una quinta sopra
  }

  // Le policy autoplay tengono il contesto "suspended" finche' non c'e' un
  // gesto dell'utente: sulla TV non ne arriva mai nessuno. Si prova a
  // riprendere a ogni suono e a ogni tocco, e intanto si avvisa a schermo.
  function kaching() {
    try {
      var c = ctx();
      if (!c) return;
      if (c.state === 'running') { play(); return; }
      c.resume().then(function () { play(); updateHint(); }).catch(function () {});
    } catch (e) { /* audio non disponibile: amen */ }
  }

  function updateHint() {
    var on = audioCtx && audioCtx.state === 'running';
    $('audioHint').classList.toggle('show', !on);
  }

  ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () {
      var c = ctx();
      if (!c || c.state === 'running') { updateHint(); return; }
      // Sbloccato adesso: un colpo di prova, cosi' si sente che funziona.
      c.resume().then(function () { updateHint(); play(); }).catch(function () {});
    }, { passive: true });
  });
  ctx();                        // niente suono all'avvio: solo la sonda
  if (audioCtx) audioCtx.onstatechange = updateHint;
  updateHint();

  function connect() {
    var es = new EventSource('/events');
    es.onmessage = function (ev) {
      offline.classList.remove('show');
      try { render(JSON.parse(ev.data)); } catch (e) {}
    };
    es.onopen = function () { offline.classList.remove('show'); };
    es.onerror = function () {
      offline.classList.add('show');
      es.close();
      setTimeout(connect, 2000);          // la TV deve tornare su da sola
    };
  }
  connect();
})();
</script>
</body>
</html>
