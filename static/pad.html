<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<title>Comando numeri</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #151c25;
    --tile: #202a36;
    --text: #f4f7fb;
    --muted: #7f8fa3;
    --accent: #ffc107;
    --accent-ink: #241c00;
    --danger: #e5484d;
    --ok: #3ddc84;
    --ok-ink: #06301a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); }

  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 4px; font-size: 14px; color: var(--muted); flex: none;
  }
  #dot { width: 11px; height: 11px; border-radius: 50%; background: var(--ok); flex: none; }
  #dot.off { background: var(--danger); }
  #bar .counts { margin-left: auto; font-weight: 700; color: var(--text); }
  #bar .counts .sep { color: var(--muted); font-weight: 400; margin: 0 6px; }

  /* ---- le due liste ---- */
  #lists { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 80px; }
  .zone { background: var(--panel); border-radius: 14px; padding: 10px; margin-bottom: 8px; }
  .zone h2 {
    margin: 2px 4px 8px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  #readyZone h2 { color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-width: 80px; min-height: 66px; padding: 0 14px;
    background: var(--tile); border: none; border-radius: 13px;
    color: var(--text); font-size: 30px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
  }
  .chip:active { transform: scale(0.94); filter: brightness(1.35); }
  #readyChips .chip { background: var(--ok); color: var(--ok-ink); }
  #readyChips .chip.latest { background: var(--accent); color: var(--accent-ink); }
  .zoneEmpty { color: var(--muted); font-size: 15px; padding: 6px 4px 10px; }

  /* ---- inserimento ---- */
  #entry {
    margin: 6px 0; padding: 4px 16px; height: 66px; flex: none;
    background: var(--panel); border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #entryValue { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  #entryValue.placeholder { color: var(--muted); font-weight: 600; font-size: 22px; letter-spacing: 0; }
  #toast { font-size: 15px; font-weight: 700; color: var(--accent); opacity: 0; transition: opacity .2s; text-align: right; max-width: 55%; }
  #toast.show { opacity: 1; }

  /* ---- tastierino ---- */
  #pad {
    flex: none; display: grid; gap: 7px;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: minmax(58px, 9vh);
    padding-bottom: 6px;
  }
  .key {
    background: var(--tile); border: none; border-radius: 13px;
    color: var(--text); font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .key:active { background: #2e3b4a; transform: scale(0.96); }
  .key.wide { grid-column: span 2; }
  .key.add { background: var(--accent); color: var(--accent-ink); font-size: 21px; letter-spacing: .5px; }
  .key.add:active { background: #e0a800; }
  .key.add[disabled] { background: #3a4250; color: #6b7683; }

  /* ---- menu contestuale ---- */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #modal.show { display: flex; }
  #modalCard { background: var(--panel); border-radius: 20px; padding: 22px 18px; width: 100%; max-width: 420px; text-align: center; }
  #modalText { font-size: 18px; color: var(--muted); }
  #modalNumber { font-size: 58px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; margin-bottom: 18px; }
  #modalActions { display: flex; flex-direction: column; gap: 10px; }
  .mbtn { border: none; border-radius: 13px; min-height: 68px; font-size: 19px; font-weight: 700; color: var(--text); padding: 0 12px; }
  .mbtn:active { transform: scale(.97); }
  .mbtn.primary { background: var(--ok); color: var(--ok-ink); font-size: 22px; min-height: 78px; }
  .mbtn.danger  { background: var(--danger); }
  .mbtn.neutral { background: var(--tile); }
  .mbtn.close   { background: transparent; color: var(--muted); min-height: 56px; font-size: 17px; }
</style>
</head>
<body>

<div id="bar">
  <span id="dot"></span><span id="status">Collegato</span>
  <span class="counts"><span id="cPending">0</span> in prep.<span class="sep">|</span><span id="cReady">0</span> pronti</span>
</div>

<div id="lists">
  <section class="zone" id="pendingZone">
    <h2>In preparazione — tocca per dire PRONTO</h2>
    <div class="chips" id="pendingChips"></div>
    <div class="zoneEmpty" id="pendingEmpty">Nessun ordine in coda.</div>
  </section>
  <section class="zone" id="readyZone">
    <h2>Pronti — tocca quando ritirano</h2>
    <div class="chips" id="readyChips"></div>
    <div class="zoneEmpty" id="readyEmpty">Nessun ordine pronto.</div>
  </section>
</div>

<div id="entry">
  <div id="entryValue" class="placeholder">Numero dell'ordine</div>
  <div id="toast"></div>
</div>

<div id="pad">
  <button class="key" data-d="1">1</button>
  <button class="key" data-d="2">2</button>
  <button class="key" data-d="3">3</button>
  <button class="key" data-d="4">4</button>
  <button class="key" data-d="5">5</button>
  <button class="key" data-d="6">6</button>
  <button class="key" data-d="7">7</button>
  <button class="key" data-d="8">8</button>
  <button class="key" data-d="9">9</button>
  <button class="key" id="back">⌫</button>
  <button class="key" data-d="0">0</button>
  <button class="key" id="clearEntry">C</button>
  <button class="key add wide" id="add" disabled>AGGIUNGI IN CODA</button>
  <button class="key" id="clearAll">Svuota</button>
</div>

<div id="modal">
  <div id="modalCard">
    <div id="modalText">Ordine</div>
    <div id="modalNumber">—</div>
    <div id="modalActions"></div>
  </div>
</div>

<script>
(function () {
  var MAX_DIGITS = 4;
  var entry = '';
  var state = { pending: [], ready: [], last_ready: null, version: -1 };

  var $ = function (id) { return document.getElementById(id); };
  var entryValue = $('entryValue'), addBtn = $('add'), toast = $('toast'), modal = $('modal');

  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  function say(msg, color) {
    toast.textContent = msg;
    toast.style.color = color || 'var(--accent)';
    toast.classList.add('show');
    clearTimeout(say.t);
    say.t = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.state) { state = res.state; renderLists(); }
      return res;
    }).catch(function () {
      say('Errore di rete', 'var(--danger)');
      return { ok: false, error: 'rete' };
    });
  }

  // ---- inserimento -------------------------------------------------------

  function renderEntry() {
    if (entry === '') {
      entryValue.textContent = "Numero dell'ordine";
      entryValue.classList.add('placeholder');
      addBtn.disabled = true;
    } else {
      entryValue.textContent = entry;
      entryValue.classList.remove('placeholder');
      addBtn.disabled = false;
    }
  }

  document.querySelectorAll('[data-d]').forEach(function (k) {
    k.addEventListener('click', function () {
      if (entry.length >= MAX_DIGITS) return;
      if (entry === '' && k.dataset.d === '0') return;   // niente zeri iniziali
      entry += k.dataset.d;
      buzz(12); renderEntry();
    });
  });
  $('back').addEventListener('click', function () { entry = entry.slice(0, -1); buzz(12); renderEntry(); });
  $('clearEntry').addEventListener('click', function () { entry = ''; buzz(20); renderEntry(); });

  addBtn.addEventListener('click', function () {
    var n = parseInt(entry, 10);
    if (!n) return;
    entry = ''; renderEntry(); buzz(35);
    post('/api/add', { number: n }).then(function (res) {
      if (res.ok) say('In coda: ' + n);
      else if (res.error === 'gia_presente') say('Il ' + n + " c'è già", 'var(--danger)');
    });
  });

  // ---- liste -------------------------------------------------------------

  function fillChips(container, emptyEl, numbers, onTap, highlight) {
    container.innerHTML = '';
    numbers.slice().sort(function (a, b) { return a - b; }).forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'chip' + (n === highlight ? ' latest' : '');
      b.textContent = n;
      b.addEventListener('click', function () { onTap(n); });
      container.appendChild(b);
    });
    emptyEl.hidden = numbers.length > 0;
  }

  function renderLists() {
    $('cPending').textContent = state.pending.length;
    $('cReady').textContent = state.ready.length;
    fillChips($('pendingChips'), $('pendingEmpty'), state.pending, menuPending, null);
    fillChips($('readyChips'), $('readyEmpty'), state.ready, menuReady, state.last_ready);
  }

  // ---- menu contestuale --------------------------------------------------

  function openMenu(number, testo, azioni) {
    buzz(20);
    $('modalText').textContent = testo;
    $('modalNumber').textContent = number;
    var box = $('modalActions');
    box.innerHTML = '';
    azioni.forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'mbtn ' + a.stile;
      b.textContent = a.testo;
      b.addEventListener('click', function () {
        closeMenu();
        if (a.azione) { buzz(35); a.azione(); }
      });
      box.appendChild(b);
    });
    modal.classList.add('show');
  }
  function closeMenu() { modal.classList.remove('show'); }

  // Chiude toccando fuori dalla scheda: evita di restare bloccati.
  modal.addEventListener('click', function (ev) { if (ev.target === modal) closeMenu(); });

  function menuPending(n) {
    openMenu(n, 'Ordine in preparazione', [
      { testo: '✓  È PRONTO', stile: 'primary', azione: function () {
          post('/api/ready', { number: n, ready: true }).then(function (res) {
            if (res.ok) say('Pronto: ' + n, 'var(--ok)');
          });
        } },
      { testo: 'Cancella ordine', stile: 'danger', azione: function () {
          confermaCancella(n);
        } },
      { testo: 'Chiudi', stile: 'close' }
    ]);
  }

  function menuReady(n) {
    openMenu(n, 'Ordine pronto', [
      { testo: '✓  RITIRATO', stile: 'primary', azione: function () {
          post('/api/remove', { number: n }).then(function (res) {
            if (res.ok) say('Ritirato ' + n, 'var(--ok)');
          });
        } },
      { testo: 'Torna in preparazione', stile: 'neutral', azione: function () {
          post('/api/ready', { number: n, ready: false }).then(function (res) {
            if (res.ok) say(n + ' rimesso in coda');
          });
        } },
      { testo: 'Chiudi', stile: 'close' }
    ]);
  }

  // Cancellare un ordine non ritirato e' l'unica azione distruttiva:
  // chiede una conferma in piu'.
  function confermaCancella(n) {
    openMenu(n, 'Cancellare del tutto?', [
      { testo: 'SÌ, CANCELLA', stile: 'danger', azione: function () {
          post('/api/remove', { number: n }).then(function (res) {
            if (res.ok) say('Cancellato ' + n, 'var(--danger)');
          });
        } },
      { testo: 'No, lascia stare', stile: 'neutral' }
    ]);
  }

  $('clearAll').addEventListener('click', function () {
    var tot = state.pending.length + state.ready.length;
    if (!tot) return;
    openMenu(tot, 'Cancellare TUTTI gli ordini?', [
      { testo: 'SÌ, SVUOTA TUTTO', stile: 'danger', azione: function () {
          post('/api/clear').then(function () { say('Lista svuotata', 'var(--ok)'); });
        } },
      { testo: 'No, lascia stare', stile: 'neutral' }
    ]);
  });

  // ---- stato condiviso via SSE ------------------------------------------

  function connect() {
    var es = new EventSource('/events');
    es.onmessage = function (ev) {
      setOnline(true);
      try {
        var s = JSON.parse(ev.data);
        if (s.version >= state.version) { state = s; renderLists(); }
      } catch (e) {}
    };
    es.onopen = function () { setOnline(true); };
    es.onerror = function () {
      setOnline(false); es.close(); setTimeout(connect, 2000);
    };
  }
  function setOnline(on) {
    $('dot').classList.toggle('off', !on);
    $('status').textContent = on ? 'Collegato' : 'Riconnessione…';
  }

  renderEntry();
  renderLists();
  connect();

  // Lo schermo non deve spegnersi durante il servizio.
  if ('wakeLock' in navigator) {
    var lock = null;
    var acquire = function () {
      navigator.wakeLock.request('screen').then(function (l) {
        lock = l;
        l.addEventListener('release', function () { lock = null; });
      }).catch(function () {});
    };
    acquire();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && lock === null) acquire();
    });
  }
})();
</script>
</body>
</html>
